name: Linux validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privileged-systemd:
    strategy:
      fail-fast: false
      matrix:
        os: ['22.04', '24.04']
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go run ./scripts/release -arch amd64 -offline -out /tmp/mihomoctl-go-system-candidate
      - name: Required real-core two-UID SSH TUN and crash-recovery acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client iproute2
          go test -c -o "$RUNNER_TEMP/runtimecore-privileged.test" ./internal/runtimecore
          sudo env GITHUB_ACTIONS=true sh scripts/privileged-runtime.sh \
            /tmp/mihomoctl-go-system-candidate/mihomoctl-go-0.2.0-offline-linux-amd64.tar.gz \
            "$RUNNER_TEMP/runtimecore-privileged.test"
      - run: sudo --preserve-env=GITHUB_ACTIONS sh scripts/smoke-system.sh /tmp/mihomoctl-go-system-candidate/mihomoctl-go-0.2.0-offline-linux-amd64.tar.gz
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: ['22.04', '24.04']
        arch: [amd64, arm64]
    # Native arm64 hardware runs the /proc ownership proof for real; QEMU
    # emulation gives a multi-threaded guest no stable start time, so the
    # proof fails closed under emulation and is not a valid gate.
    runs-on: ubuntu-${{ matrix.os }}${{ matrix.arch == 'arm64' && '-arm' || '' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Linux gate (${{ matrix.arch }})
        run: sh scripts/ci-linux.sh ${{ matrix.arch }}
