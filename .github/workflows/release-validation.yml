name: Release matrix gate
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  privileged-systemd:
    strategy:
      fail-fast: false
      matrix:
        os: ['22.04', '24.04']
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build pinned real-core bundle
        run: go run ./scripts/release -arch amd64 -offline -out /tmp/mihomoctl-go-system-candidate
      - name: Required real-core two-UID SSH TUN and crash-recovery acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client iproute2
          go test -c -o "$RUNNER_TEMP/runtimecore-privileged.test" ./internal/runtimecore
          sudo env GITHUB_ACTIONS=true sh scripts/privileged-runtime.sh \
            /tmp/mihomoctl-go-system-candidate/mihomoctl-go-0.2.0-offline-linux-amd64.tar.gz \
            "$RUNNER_TEMP/runtimecore-privileged.test"
      - name: Require actual privileged systemd execution
        run: sudo --preserve-env=GITHUB_ACTIONS sh scripts/smoke-system.sh /tmp/mihomoctl-go-system-candidate/mihomoctl-go-0.2.0-offline-linux-amd64.tar.gz
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: ['22.04', '24.04']
        arch: [amd64, arm64]
    # The arm64 gate runs on GitHub's native arm runners. An earlier revision
    # ran it under QEMU emulation, but qemu-user does not give a multi-threaded
    # guest a stable /proc start time, so the kernel ownership proof at the
    # heart of this product fails closed under emulation. Real arm64 hardware
    # runs the proof for real; no test of the proof is skipped.
    runs-on: ubuntu-${{ matrix.os }}${{ matrix.arch == 'arm64' && '-arm' || '' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Linux gate (${{ matrix.arch }})
        run: sh scripts/ci-linux.sh ${{ matrix.arch }}
